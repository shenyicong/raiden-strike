<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta property="og:title" content="雷霆战机 RAIDEN STRIKE">
<meta property="og:description" content="零依赖、零素材的 HTML5 Canvas 纵版弹幕射击游戏">
<meta property="og:image" content="og-cover.png">
<title>雷霆战机 RAIDEN STRIKE</title>
<style>
  :root { --accent:#5fa8ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#05060c; color:#e8eefc;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  #game { background:#000; border-radius:6px; box-shadow:0 0 40px rgba(95,168,255,.25);
    touch-action:none; overscroll-behavior:none; }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(3,6,14,.72); backdrop-filter:blur(2px); }
  .panel { background:#0c1224; border:1px solid #233; border-radius:12px; padding:24px 28px; width:min(86%,360px);
    text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .panel h1 { font-size:20px; margin:0 0 8px; }
  .panel h2 { margin:0 0 14px; }
  .panel p { margin:6px 0; font-size:13px; color:#b9c4dc; }
  .panel .hint { font-size:12px; color:#7e8aa6; }
  .panel .best { margin-top:14px; color:var(--accent); }
  button { display:block; width:100%; margin:8px 0; padding:10px; border-radius:8px; border:1px solid #2c3a5e;
    background:#15203a; color:#e8eefc; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#04101f; border-color:var(--accent); font-weight:700; }
  button:focus, input:focus, select:focus { outline:2px solid #ffd166; outline-offset:2px; } /* NFR-A11Y-07 */
  .settings label { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:8px 0; font-size:13px; }
  .settings input[type=range] { width:140px; }
  ol { text-align:left; font-size:12px; color:#cdd6ea; padding-left:18px; }
  /* 战机选择 (v2.1) */
  .panel .sec { font-size:13px; margin:12px 0 6px; color:#8fa4c8; letter-spacing:2px; }
  .ships { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .ships button { display:flex; flex-direction:column; gap:2px; width:100%; margin:0; padding:8px 6px;
    font-size:12px; text-align:center; line-height:1.35; }
  .ships button b { font-size:13px; }
  .ships button span { color:#9fb0d0; font-size:11px; }
  .ships button i { font-style:normal; color:#6f7f9e; font-size:10px; }
  .ships button.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .ships button.locked { opacity:.5; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  .diag { position:absolute; top:6px; left:50%; transform:translateX(-50%); font-size:11px;
    background:rgba(0,0,0,.6); color:#9fe; padding:4px 8px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
